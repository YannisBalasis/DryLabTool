[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ichnos-tool"
version = "0.1.0"
description = "ICHNOS pipeline: core (ichnos) + image processing (ichnos_image) packages"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "pandas",
    "pillow",
]

[project.optional-dependencies]
cellpose = ["cellpose", "torch"]
metadata = ["tifffile"]
dev = ["pytest", "tifffile"]

[tool.setuptools]
packages = ["ichnos", "ichnos_image"]
